<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>计算图特征浏览器</title>
<style>
:root{--bg:#f4f7fb;--ink:#142033;--muted:#6b7890;--line:#dce4ef;--card:#fff;--blue:#2563eb;--teal:#0f9f91;--orange:#ef8b2c;--purple:#7955d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{padding:24px 30px 18px;background:#101b33;color:white}header h1{margin:0 0 4px;font-size:24px}header p{margin:0;color:#b9c6df}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;max-width:1500px;margin:20px auto;padding:0 20px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px #1b38620b}.panel{padding:18px}.controls h2{font-size:15px;margin:0 0 16px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select,input{width:100%;border:1px solid #ccd7e6;border-radius:7px;padding:8px;background:white;color:var(--ink)}button{border:0;background:var(--blue);color:white;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:600}button:hover{background:#1d4ed8}.hint{color:var(--muted);font-size:12px;margin-top:12px}.main{min-width:0}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.card{padding:14px}.metric{font-size:22px;font-weight:750;margin-top:4px}.metric-label{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart-card{padding:16px;min-height:230px}.chart-card h2,.graph-card h2{font-size:15px;margin:0 0 12px}.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}.bar span:first-child{width:90px;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.bar i{height:14px;border-radius:3px;background:var(--blue);display:block;min-width:2px}.bar em{font-style:normal;color:var(--muted);width:48px}.legend{display:flex;flex-wrap:wrap;gap:9px;color:var(--muted);font-size:12px}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.graph-card{margin-top:18px;padding:16px}.graph-meta{color:var(--muted);font-size:12px;margin-bottom:8px}.graph-wrap{height:600px;overflow:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:8px}.graph-wrap svg{width:100%;height:100%;min-width:500px}.edge{stroke:#aab8ca;stroke-width:1;opacity:.65}.node{cursor:pointer;stroke:white;stroke-width:1.5}.node:hover{stroke:#111827;stroke-width:2}.node.focus{stroke:#111827;stroke-width:3}.node-label{font-size:10px;fill:#334155;pointer-events:none}.empty{padding:70px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:repeat(2,1fr)}header{padding-left:18px}.layout{padding:0 10px}}
</style></head>
<body><header><h1>计算图特征浏览器</h1><p>探索 Tensor / Operator 依赖、存储层级、流水线分布与关键路径</p></header>
<div class="layout"><aside class="panel controls"><h2>图选择与邻域</h2><div class="field"><label>案例</label><select id="case"></select></div><div class="field"><label>聚焦算子</label><select id="focus"></select></div><div class="field"><label>邻域半径（边数）</label><input id="radius" type="number" min="0" max="8" value="2"></div><div class="field"><label>最多显示节点</label><input id="limit" type="number" min="20" max="800" value="240"></div><div class="field"><label>节点类型</label><select id="kind"><option value="all">全部</option><option value="ops">仅算子</option><option value="tensors">仅张量</option></select></div><button id="refresh">刷新邻域</button><div class="hint">提示：点击图中的算子，可将它设为新的聚焦点。图中只显示聚焦点附近的子图，适合浏览大型案例。</div></aside>
<main class="main"><section class="cards"><div class="card"><div class="metric-label">节点总数</div><div id="nodes" class="metric">—</div></div><div class="card"><div class="metric-label">边数</div><div id="edges" class="metric">—</div></div><div class="card"><div class="metric-label">算子总周期</div><div id="cycles" class="metric">—</div></div><div class="card"><div class="metric-label">关键路径</div><div id="critical" class="metric">—</div></div><div class="card"><div class="metric-label">关键路径算子数</div><div id="criticalLen" class="metric">—</div></div></section>
<section class="grid"><div class="card chart-card"><h2>算子类型分布</h2><div id="opsChart"></div></div><div class="card chart-card"><h2>片上存储占用</h2><div id="storageChart"></div><div id="legend" class="legend"></div></div></section>
<section class="card graph-card"><h2>依赖邻域</h2><div id="graphMeta" class="graph-meta">加载中…</div><div id="graph" class="graph-wrap"></div></section></main></div>
<script>
const $=id=>document.getElementById(id), colors={DDR:'#2563eb',L1:'#0f9f91',UB:'#ef8b2c',PIPE_M:'#7955d8',PIPE_V:'#d14d72',PIPE_MTE2:'#3c9bdb',PIPE_MTE3:'#e08b27'};let cases=[],current;
const fmt=n=>Number(n||0).toLocaleString('zh-CN');
async function get(url){const r=await fetch(url);if(!r.ok)throw Error(await r.text());return r.json()}
function renderBars(el,data,color){const vals=Object.entries(data).sort((a,b)=>b[1]-a[1]),max=Math.max(...vals.map(x=>x[1]),1);$(el).innerHTML=vals.map(([k,v])=>`<div class="bar"><span title="${k}">${k}</span><i style="width:${Math.max(2,100*v/max)}%;background:${color||colors[k]||'#2563eb'}"></i><em>${fmt(v)}</em></div>`).join('')||'<div class="empty">无数据</div>'}
function renderSummary(c){current=c;$('nodes').textContent=fmt(c.nodes);$('edges').textContent=fmt(c.edges);$('cycles').textContent=fmt(c.total_cycles);$('critical').textContent=fmt(c.critical_path_cycles);$('criticalLen').textContent=fmt(c.critical_path_length);renderBars('opsChart',c.op_counts,'#2563eb');renderBars('storageChart',c.storage_bytes);$('legend').innerHTML=Object.keys(c.storage_bytes).map(k=>`<span><b style="background:${colors[k]}"></b>${k}: ${fmt(c.storage_bytes[k])} B</span>`).join('');}
function populateFocus(c){const s=$('focus'),old=s.value;s.innerHTML=Object.entries(c.op_counts).map(([k])=>'').join('');let ops=c._ops||[];s.innerHTML=ops.map(x=>`<option value="${x.id}">${x.id} · ${x.op} · ${fmt(x.cycles)} cycles</option>`).join('');if([...s.options].some(x=>x.value===old))s.value=old;else s.value=c.default_focus}
 function layoutGraph(data){const svgNS='http://www.w3.org/2000/svg',wrap=$('graph'),svg=document.createElementNS(svgNS,'svg');const width=Math.max(wrap.clientWidth-2,620),height=Math.max(wrap.clientHeight-2,580);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const op=data.nodes.filter(n=>n.type==='op'),te=data.nodes.filter(n=>n.type==='tensor'),layers=[te,op];const pos={};layers.forEach((layer,li)=>layer.forEach((n,i)=>{pos[n.id]={x:li?width*.67:width*.30,y:(i+1)*height/(layer.length+1)}}));data.edges.forEach(e=>{const l=document.createElementNS(svgNS,'line');l.setAttribute('class','edge');l.setAttribute('x1',pos[e.source].x);l.setAttribute('y1',pos[e.source].y);l.setAttribute('x2',pos[e.target].x);l.setAttribute('y2',pos[e.target].y);svg.appendChild(l)});data.nodes.forEach(n=>{const g=document.createElementNS(svgNS,'g'),p=pos[n.id],circle=document.createElementNS(svgNS,'circle');circle.setAttribute('class','node'+(n.focus?' focus':''));circle.setAttribute('cx',p.x);circle.setAttribute('cy',p.y);circle.setAttribute('r',n.type==='op'?Math.max(5,Math.min(13,5+Math.log10(Number(n.cycles||1))*2)):Math.max(4,Math.min(11,4+Math.log10(Number(n.size||1)))));circle.setAttribute('fill',n.type==='op'?(colors[n.pipe]||'#7955d8'):(colors[n.pos]||'#94a3b8'));circle.onclick=()=>{if(n.type==='op'){$('focus').value=n.raw_id;loadGraph()}};g.appendChild(circle);if(n.type==='op'||n.focus){const t=document.createElementNS(svgNS,'text');t.setAttribute('class','node-label');t.setAttribute('x',p.x+(n.type==='op'?10:-8));t.setAttribute('y',p.y-9);t.setAttribute('text-anchor',n.type==='op'?'start':'end');t.textContent=n.type==='op'?`${n.raw_id} ${n.label}`:n.raw_id;g.appendChild(t)}svg.appendChild(g)});wrap.innerHTML='';wrap.appendChild(svg)}
async function loadGraph(){const params=new URLSearchParams({case:$('case').value,focus:$('focus').value,radius:$('radius').value,limit:$('limit').value,kind:$('kind').value});$('graphMeta').textContent='加载邻域…';try{const d=await get('/api/case?'+params);layoutGraph(d);$('graphMeta').textContent=`聚焦算子 ${d.focus} · 显示 ${fmt(d.nodes.length)} 个节点、${fmt(d.edges.length)} 条边${d.truncated?' · 已达到节点上限':''}；颜色：算子=流水线，张量=存储位置`;}catch(e){$('graph').innerHTML=`<div class="empty">${e}</div>`}}
async function loadCase(){const c=cases.find(x=>x.case===$('case').value);if(!c)return;const ops=await get('/api/ops?case='+encodeURIComponent(c.case));c._ops=ops.sort((a,b)=>b.cycles-a.cycles);renderSummary(c);populateFocus(c);loadGraph()}
async function init(){cases=await get('/api/cases');$('case').innerHTML=cases.map(c=>`<option value="${c.case}">${c.case.replace('.json','')}</option>`).join('');$('case').onchange=loadCase;$('refresh').onclick=loadGraph;$('focus').onchange=loadGraph;loadCase()}
init().catch(e=>{$('graphMeta').textContent='加载失败：'+e});
</script></body></html>
